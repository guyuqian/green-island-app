获取验证码
</button>

<a href=""  id="loginSubmitBtn" class="w-full bg-primary text-white py-3 rounded-button flex items-center justify-center no-underline cursor-pointer">
登录

<div id="agreementModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">

<h3 class="text-lg font-medium text-primary mb-4">用户协议及隐私政策</h3>

</div>
</div>
</div>

<div id="nameInputModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
<div class="bg-white w-[320px] rounded-lg p-6 relative">
<div class="text-center">
<h3 class="text-lg font-medium mb-6">请输入您的姓名</h3>
<form id="nameForm" class="space-y-4">
<input type="text" id="nameInput" class="w-full px-4 py-3 border rounded-button focus:outline-none focus:border-primary" placeholder="请输入您的姓名" maxlength="20">
<button type="submit" class="w-full bg-primary text-white py-3 rounded-button">确认</button>
</form>
</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
const nameModal = document.getElementById('nameInputModal');
const nameForm = document.getElementById('nameForm');
const nameInput = document.getElementById('nameInput');
const phoneModal = document.getElementById('phoneLoginModal');
const alipayModal = document.getElementById('alipayLoginModal');
const weiboModal = document.getElementById('weiboLoginModal');
const phoneBtn = document.querySelector('.border-primary');
const alipayBtn = document.getElementById('alipayLoginBtn');
const weiboBtn = document.getElementById('weiboLoginBtn');
const closeAlipayBtn = document.getElementById('closeAlipayModal');
const closeWeiboBtn = document.getElementById('closeWeiboModal');
const closeBtn = document.getElementById('closeModal');
const form = document.getElementById('phoneLoginForm');
const phoneInput = document.getElementById('phoneInput');
const codeInput = document.getElementById('codeInput');
const getCodeBtn = document.getElementById('getCodeBtn');
let countdown = 60;
let timer = null;
let lastPhone = '';
function showPhoneModal() {
phoneModal.classList.remove('hidden');
phoneModal.classList.add('flex');
}
function hidePhoneModal() {
phoneModal.classList.add('hidden');
phoneModal.classList.remove('flex');
form.reset();
resetGetCodeBtn();
}
function showAlipayModal() {
alipayModal.classList.remove('hidden');
alipayModal.classList.add('flex');
}
function hideAlipayModal() {
alipayModal.classList.add('hidden');
alipayModal.classList.remove('flex');
}
function startCountdown() {
getCodeBtn.disabled = true;
getCodeBtn.classList.add('text-gray-400');
lastPhone = phoneInput.value.trim();
timer = setInterval(() => {
getCodeBtn.textContent = `${countdown}秒后重试`;
countdown--;
if (countdown < 0) {
resetGetCodeBtn();
}
}, 1000);
}
function resetGetCodeBtn() {
clearInterval(timer);
countdown = 60;
getCodeBtn.disabled = false;
getCodeBtn.classList.remove('text-gray-400');
getCodeBtn.textContent = '获取验证码';
}
function validatePhone(phone) {
return /^1[3-9]\d{9}$/.test(phone);
}
phoneBtn.addEventListener('click', (e) => {
e.preventDefault();
showAgreementModal();
});
closeBtn.addEventListener('click', hidePhoneModal);
phoneModal.addEventListener('click', (e) => {
if (e.target === phoneModal) hidePhoneModal();
});
alipayBtn.addEventListener('click', showAlipayModal);
closeAlipayBtn.addEventListener('click', hideAlipayModal);
alipayModal.addEventListener('click', (e) => {
if (e.target === alipayModal) hideAlipayModal();
});
function showQQModal() {
qqModal.classList.remove('hidden');
qqModal.classList.add('flex');
}
function hideQQModal() {
qqModal.classList.add('hidden');
qqModal.classList.remove('flex');
}
function showWeiboModal() {
weiboModal.classList.remove('hidden');
weiboModal.classList.add('flex');
}
function hideWeiboModal() {
weiboModal.classList.add('hidden');
weiboModal.classList.remove('flex');
}
const qqModal = document.getElementById('qqLoginModal');
const qqBtn = document.getElementById('qqLoginBtn');
const closeQQBtn = document.getElementById('closeQQModal');
qqBtn.addEventListener('click', showQQModal);
closeQQBtn.addEventListener('click', hideQQModal);
qqModal.addEventListener('click', (e) => {
if (e.target === qqModal) hideQQModal();
});
weiboBtn.addEventListener('click', showWeiboModal);
closeWeiboBtn.addEventListener('click', hideWeiboModal);
weiboModal.addEventListener('click', (e) => {
if (e.target === weiboModal) hideWeiboModal();
});
phoneInput.addEventListener('input', () => {
if (validatePhone(phoneInput.value.trim())) {
getCodeBtn.disabled = false;
getCodeBtn.classList.remove('text-gray-400');
} else {
getCodeBtn.disabled = true;
getCodeBtn.classList.add('text-gray-400');
}
});
getCodeBtn.addEventListener('click', () => {
const phone = phoneInput.value.trim();
if (!validatePhone(phone)) {
const toast = document.createElement('div');
toast.className = 'fixed top-4 left-1/2 -translate-x-1/2 bg-black bg-opacity-70 text-white px-4 py-2 rounded-lg text-sm';
toast.textContent = '请输入正确的手机号';
document.body.appendChild(toast);
setTimeout(() => toast.remove(), 2000);
return;
}
startCountdown();
setTimeout(() => {
const verificationCode = Math.floor(100000 + Math.random() * 900000).toString();
codeInput.value = verificationCode;
const toast = document.createElement('div');
toast.className = 'fixed top-4 left-1/2 -translate-x-1/2 bg-black bg-opacity-70 text-white px-4 py-2 rounded-lg text-sm';
toast.textContent = '验证码已发送';
document.body.appendChild(toast);
setTimeout(() => toast.remove(), 2000);
}, 1000);
});
form.addEventListener('submit', (e) => {
e.preventDefault();
const phone = phoneInput.value.trim();
const code = codeInput.value.trim();
if (!validatePhone(phone)) {
return;
}
if (!/^\d{6}$/.test(code)) {
const toast = document.createElement('div');
toast.className = 'fixed top-4 left-1/2 -translate-x-1/2 bg-black bg-opacity-70 text-white px-4 py-2 rounded-lg text-sm';
toast.textContent = '请输入6位验证码';
document.body.appendChild(toast);
setTimeout(() => toast.remove(), 2000);
return;
}
document.getElementById('loginSubmitBtn').click();
});
function showAgreementModal() {
const agreementModal = document.getElementById('agreementModal');
agreementModal.classList.remove('hidden');
agreementModal.classList.add('flex');
}
function hideAgreementModal() {
const agreementModal = document.getElementById('agreementModal');
agreementModal.classList.add('hidden');
agreementModal.classList.remove('flex');
}
function showNameModal() {
nameModal.classList.remove('hidden');
nameModal.classList.add('flex');
}
function hideNameModal() {
nameModal.classList.add('hidden');
nameModal.classList.remove('flex');
}
nameModal.addEventListener('click', (e) => {
if (e.target === nameModal) {
hideNameModal();
}
});
nameForm.addEventListener('submit', (e) => {
e.preventDefault();
const name = nameInput.value.trim();
if (!name) {
const toast = document.createElement('div');
toast.className = 'fixed top-4 left-1/2 -translate-x-1/2 bg-black bg-opacity-70 text-white px-4 py-2 rounded-lg text-sm';
toast.textContent = '请输入您的姓名';
document.body.appendChild(toast);
setTimeout(() => toast.remove(), 2000);
return;
}
localStorage.setItem('userName', name);
hideNameModal();
window.location.href = '
