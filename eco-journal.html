<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的绿色日记</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#2E8B57',secondary:'#A7D7C2'},borderRadius:{'none':'0px','sm':'4px',DEFAULT:'8px','md':'12px','lg':'16px','xl':'20px','2xl':'24px','3xl':'32px','full':'9999px','button':'8px'}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
:where([class^="ri-"])::before { content: "\f3c2"; }
body {
background-color: #f8faf8;
font-family: 'Noto Sans SC', sans-serif;
}
.diary-input {
border: 1px dashed #2E8B57;
min-height: 100px;
}
.diary-input:focus {
outline: none;
border: 1px solid #2E8B57;
}
</style>
</head>
<body class="bg-gray-50 text-gray-800">
<!-- 顶部导航栏 -->
<nav class="bg-primary text-white px-4 py-3 flex items-center justify-between fixed w-full top-0 z-10">
<div class="flex items-center">
<a href="" >
<i class="ri-arrow-left-s-line ri-lg cursor-pointer"></i>
</a>
<span class="ml-3 text-lg font-medium">我的绿色日记</span>
</div>
<div class="w-8 h-8 flex items-center justify-center cursor-pointer">
<i class="ri-more-2-fill ri-lg"></i>
</div>
</nav>
<!-- 主内容区域 -->
<main class="pt-16 pb-20 px-4">
<!-- 标题区域 -->
<div class="mt-4 mb-6">
<h1 class="text-xl font-medium text-primary">我的绿色日记</h1>
<p class="text-sm text-gray-500 mt-1">每一项选择都有回响</p>
</div>
<!-- 日期选择器 -->
<div class="flex items-center justify-between mb-6">
<div class="text-sm text-gray-500">2025年04月30日 星期三</div>
<div class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full cursor-pointer">
<i class="ri-calendar-line text-primary"></i>
</div>
</div>
<!-- 今日记录模块 -->
<div class="bg-white rounded p-4 shadow-sm mb-6">
<div class="flex items-center mb-4">
<div class="w-6 h-6 flex items-center justify-center text-primary">
<i class="ri-line-chart-line"></i>
</div>
<h2 class="text-base font-medium ml-2">今日记录</h2>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="bg-gray-50 p-3 rounded">
<div class="text-xs text-gray-500 mb-1">碳输出</div>
<div class="flex items-end">
<span class="text-lg font-medium text-primary">0.042</span>
<span class="text-xs ml-1 text-gray-500">kg</span>
</div>
</div>
<div class="bg-gray-50 p-3 rounded">
<div class="text-xs text-gray-500 mb-1">行动绿值</div>
<div class="flex items-end">
<span class="text-lg font-medium text-primary">73</span>
<span class="text-xs ml-1 text-gray-500">（偏稳）</span>
</div>
</div>
<div class="bg-gray-50 p-3 rounded">
<div class="text-xs text-gray-500 mb-1">绿语上传</div>
<div class="flex items-center">
<span class="text-green-500">
<i class="ri-checkbox-circle-fill ri-lg"></i>
</span>
<span class="text-sm ml-1">已完成</span>
</div>
</div>
<div class="bg-gray-50 p-3 rounded">
<div class="text-xs text-gray-500 mb-1">安静等级</div>
<div class="text-sm">中</div>
</div>
<div class="bg-gray-50 p-3 rounded col-span-2">
<div class="text-xs text-gray-500 mb-1">心跳节律</div>
<div class="flex items-center">
<span class="text-sm">与标准绿频同步率</span>
<span class="text-lg font-medium text-primary ml-1">87%</span>
</div>
</div>
</div>
</div>
<!-- 行为打卡模块 -->
<div class="bg-white rounded p-4 shadow-sm mb-6">
<div class="flex items-center mb-4">
<div class="w-6 h-6 flex items-center justify-center text-primary">
<i class="ri-task-line"></i>
</div>
<h2 class="text-base font-medium ml-2">行为打卡</h2>
</div>
<div class="space-y-3">
<div class="flex items-center">
<div class="w-6 h-6 flex items-center justify-center text-green-500">
<i class="ri-checkbox-circle-fill"></i>
</div>
<span class="ml-2 text-sm">垃圾九分类完成</span>
</div>
<div class="flex items-center">
<div class="w-6 h-6 flex items-center justify-center text-green-500">
<i class="ri-checkbox-circle-fill"></i>
</div>
<span class="ml-2 text-sm">清晨绿光沐浴 10 分钟</span>
</div>
<div class="flex items-center">
<div class="w-6 h-6 flex items-center justify-center text-green-500">
<i class="ri-checkbox-circle-fill"></i>
</div>
<span class="ml-2 text-sm">避免不必要谈话</span>
</div>
<div class="flex items-center">
<div class="w-6 h-6 flex items-center justify-center text-green-500">
<i class="ri-checkbox-circle-fill"></i>
</div>
<span class="ml-2 text-sm">植物共感观想</span>
</div>
<div>
<div class="flex items-center">
<div class="w-6 h-6 flex items-center justify-center text-gray-400">
<i class="ri-checkbox-blank-circle-line"></i>
</div>
<span class="ml-2 text-sm text-gray-500">情绪低震模式保持</span>
</div>
<div class="ml-8 mt-1 text-xs text-red-500">
失败记录：晚间焦虑
</div>
</div>
</div>
</div>
<!-- 手写笔记模块 -->
<div class="bg-white rounded p-4 shadow-sm mb-6">
<div class="flex items-center mb-4">
<div class="w-6 h-6 flex items-center justify-center text-primary">
<i class="ri-edit-line"></i>
</div>
<h2 class="text-base font-medium ml-2">手写笔记（系统可见）</h2>
</div>
<textarea class="diary-input w-full p-3 rounded text-sm" placeholder="写下你今日与自然的和谐瞬间"></textarea>
<div class="mt-2 text-xs text-gray-500">
提交后文字自动参与绿值情绪分析
</div>
<button class="mt-3 bg-primary text-white py-2 px-4 w-full !rounded-button flex items-center justify-center cursor-pointer">
<i class="ri-send-plane-fill mr-1"></i>
<span>提交笔记</span>
</button>
</div>
<!-- 系统提示语 -->
<div class="bg-white rounded p-4 shadow-sm mb-6 border-l-4 border-primary">
<div class="text-sm text-gray-600 italic">
"如果你未能保持节律，请不要责备自己。我们正在共同进化。"
</div>
</div>
<!-- 绿值波动图 -->
<div class="bg-white rounded p-4 shadow-sm mb-6">
<div class="flex items-center justify-between mb-4">
<div class="flex items-center">
<div class="w-6 h-6 flex items-center justify-center text-primary">
<i class="ri-bar-chart-grouped-line"></i>
</div>
<h2 class="text-base font-medium ml-2">绿值波动</h2>
</div>
<div class="text-xs text-primary cursor-pointer">
查看详情
</div>
</div>
<div id="chart" class="w-full h-48"></div>
</div>
<!-- 底部提示 -->
<div class="text-center text-xs text-gray-500 mb-4">
数据将用于生成月度绿值反馈书
</div>
<!-- 生成回顾图表按钮 -->
<button class="bg-primary text-white py-3 px-4 w-full !rounded-button flex items-center justify-center cursor-pointer mb-6">
<i class="ri-file-chart-line mr-2"></i>
<span>生成回顾图表</span>
</button>
</main>
<!-- 底部标签栏 -->
<div class="fixed bottom-0 w-full bg-white border-t border-gray-200 px-2 py-1">
<div class="grid grid-cols-3">
<a href=""  class="flex flex-col items-center py-1 cursor-pointer">
<div class="w-6 h-6 flex items-center justify-center">
<i class="ri-home-line text-gray-400"></i>
</div>
<span class="text-xs text-gray-400 mt-1">首页</span>
</a>
<div class="flex flex-col items-center py-1 cursor-pointer">
<div class="w-6 h-6 flex items-center justify-center">
<i class="ri-book-2-line text-primary"></i>
</div>
<span class="text-xs text-primary mt-1">手账</span>
</div>
<a href=""  class="flex flex-col items-center py-1 cursor-pointer">
<div class="w-6 h-6 flex items-center justify-center">
<i class="ri-user-line text-gray-400"></i>
</div>
<span class="text-xs text-gray-400 mt-1">我的</span>
</a>
</div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
// 初始化图表
const chartDom = document.getElementById('chart');
const myChart = echarts.init(chartDom);
const option = {
grid: {
top: 10,
right: 10,
bottom: 20,
left: 40
},
xAxis: {
type: 'category',
data: ['24日', '25日', '26日', '27日', '28日', '29日', '今日'],
axisLine: {
lineStyle: {
color: '#ddd'
}
},
axisLabel: {
fontSize: 10,
color: '#999'
}
},
yAxis: {
type: 'value',
min: 0,
max: 100,
axisLine: {
show: false
},
axisLabel: {
fontSize: 10,
color: '#999'
},
splitLine: {
lineStyle: {
color: '#eee'
}
}
},
series: [
{
name: '绿值',
type: 'line',
data: [65, 68, 62, 70, 65, 69, 73],
smooth: true,
symbol: 'circle',
symbolSize: 6,
itemStyle: {
color: '#2E8B57'
},
lineStyle: {
color: '#2E8B57',
width: 3
},
areaStyle: {
color: {
type: 'linear',
x: 0,
y: 0,
x2: 0,
y2: 1,
colorStops: [
{
offset: 0,
color: 'rgba(46, 139, 87, 0.3)'
},
{
offset: 1,
color: 'rgba(46, 139, 87, 0.05)'
}
]
}
}
}
],
tooltip: {
trigger: 'axis',
formatter: '{b}: {c}',
backgroundColor: 'rgba(255, 255, 255, 0.9)',
borderColor: '#eee',
borderWidth: 1,
textStyle: {
color: '#333'
},
padding: [5, 10]
}
};
myChart.setOption(option);
// 响应窗口大小变化
window.addEventListener('resize', function() {
myChart.resize();
});
});
// 提交笔记按钮点击事件
document.querySelector('.diary-input + div + button').addEventListener('click', function() {
const diaryText = document.querySelector('.diary-input').value.trim();
if (!diaryText) {
// 显示提示
const toast = document.createElement('div');
toast.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black bg-opacity-70 text-white px-4 py-2 rounded-lg text-sm';
toast.textContent = '请输入今日与自然的和谐瞬间';
document.body.appendChild(toast);
setTimeout(() => {
toast.remove();
}, 2000);
return;
}
// 模拟提交成功
document.querySelector('.diary-input').value = '';
const toast = document.createElement('div');
toast.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black bg-opacity-70 text-white px-4 py-2 rounded-lg text-sm';
toast.textContent = '笔记已提交，绿值情绪分析中...';
document.body.appendChild(toast);
setTimeout(() => {
toast.remove();
}, 2000);
});
// 生成回顾图表按钮点击事件
document.querySelector('button:last-of-type').addEventListener('click', function() {
// 创建弹窗
const modal = document.createElement('div');
modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-20';
modal.innerHTML = `
<div class="bg-white rounded-lg w-5/6 max-h-[80vh] overflow-y-auto">
<div class="p-4 border-b border-gray-200 flex justify-between items-center">
<h3 class="text-lg font-medium">本月绿值回顾</h3>
<div class="w-8 h-8 flex items-center justify-center cursor-pointer close-modal">
<i class="ri-close-line ri-lg"></i>
</div>
</div>
<div class="p-4">
<div class="mb-4">
<div class="text-sm text-gray-500 mb-2">本月绿值平均</div>
<div class="text-2xl font-medium text-primary">68.5</div>
</div>
<div id="monthChart" class="w-full h-48 mb-4"></div>
<div class="grid grid-cols-2 gap-3 mb-4">
<div class="bg-gray-50 p-3 rounded">
<div class="text-xs text-gray-500 mb-1">最高绿值日</div>
<div class="text-sm">4月12日 (82)</div>
</div>
<div class="bg-gray-50 p-3 rounded">
<div class="text-xs text-gray-500 mb-1">最低绿值日</div>
<div class="text-sm">4月5日 (51)</div>
</div>
<div class="bg-gray-50 p-3 rounded">
<div class="text-xs text-gray-500 mb-1">碳输出总量</div>
<div class="text-sm">1.24 kg</div>
</div>
<div class="bg-gray-50 p-3 rounded">
<div class="text-xs text-gray-500 mb-1">绿语上传率</div>
<div class="text-sm">87%</div>
</div>
</div>
<div class="bg-gray-50 p-3 rounded mb-4">
<div class="text-xs text-gray-500 mb-2">系统建议</div>
<div class="text-sm text-gray-700">
您的绿值波动较为稳定，建议在植物共感观想方面增加每日练习时长，可提升心跳节律与标准绿频的同步率。
</div>
</div>
<button id="saveReportBtn" class="bg-primary text-white py-2 px-4 w-full !rounded-button flex items-center justify-center cursor-pointer">
<i class="ri-download-line mr-1"></i>
<span>保存回顾报告</span>
</button>
</div>
</div>
`;
document.body.appendChild(modal);
// Add save report functionality
document.getElementById('saveReportBtn').addEventListener('click', function() {
// Show loading animation
const loadingModal = document.createElement('div');
loadingModal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-30';
loadingModal.innerHTML = `
<div class="bg-white rounded-lg p-6 flex flex-col items-center">
<div class="animate-spin rounded-full h-12 w-12 border-4 border-primary border-t-transparent mb-4"></div>
<div class="text-gray-700">正在保存报告...</div>
</div>
`;
document.body.appendChild(loadingModal);
// Simulate saving process
setTimeout(() => {
loadingModal.remove();
// Show success modal
const successModal = document.createElement('div');
successModal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-30';
successModal.innerHTML = `
<div class="bg-white rounded-lg w-5/6 max-w-sm">
<div class="p-6">
<div class="flex items-center justify-center mb-4">
<div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center">
<i class="ri-check-line ri-2x text-green-500"></i>
</div>
</div>
<h3 class="text-center text-lg font-medium mb-2">报告保存成功</h3>
<p class="text-center text-sm text-gray-500 mb-4">已保存至我的文档</p>
<div class="flex space-x-3 mb-4">
<button class="flex-1 py-2 border border-gray-200 !rounded-button text-sm">查看报告</button>
<button class="flex-1 py-2 border border-gray-200 !rounded-button text-sm">分享链接</button>
</div>
<button id="shareToComBtn" class="w-full bg-primary text-white py-2 !rounded-button text-sm flex items-center justify-center">
<i class="ri-share-line mr-1"></i>
分享到社区
</button>
</div>
</div>
`;
document.body.appendChild(successModal);
// Close success modal when clicking outside
successModal.addEventListener('click', function(e) {
if (e.target === successModal) {
successModal.remove();
}
});
// Share to community button click handler
document.getElementById('shareToComBtn').addEventListener('click', function() {
const shareToast = document.createElement('div');
shareToast.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black bg-opacity-70 text-white px-4 py-2 rounded-lg text-sm z-40';
shareToast.textContent = '已分享到社区';
document.body.appendChild(shareToast);
setTimeout(() => {
shareToast.remove();
successModal.remove();
}, 1500);
});
}, 1500);
});
// 初始化月度图表
setTimeout(() => {
const monthChartDom = document.getElementById('monthChart');
if (monthChartDom) {
const monthChart = echarts.init(monthChartDom);
const monthOption = {
grid: {
top: 10,
right: 10,
bottom: 20,
left: 40
},
xAxis: {
type: 'category',
data: ['1周', '2周', '3周', '4周', '5周'],
axisLine: {
lineStyle: {
color: '#ddd'
}
},
axisLabel: {
fontSize: 10,
color: '#999'
}
},
yAxis: {
type: 'value',
min: 40,
max: 90,
axisLine: {
show: false
},
axisLabel: {
fontSize: 10,
color: '#999'
},
splitLine: {
lineStyle: {
color: '#eee'
}
}
},
series: [
{
name: '周平均绿值',
type: 'bar',
data: [64, 59, 72, 68, 71],
itemStyle: {
color: '#2E8B57'
},
barWidth: '40%'
},
{
name: '趋势线',
type: 'line',
data: [64, 59, 72, 68, 71],
smooth: true,
symbol: 'none',
lineStyle: {
color: '#A7D7C2',
width: 2
}
}
],
tooltip: {
trigger: 'axis',
formatter: '{b}: {c}',
backgroundColor: 'rgba(255, 255, 255, 0.9)',
borderColor: '#eee',
borderWidth: 1,
textStyle: {
color: '#333'
},
padding: [5, 10]
}
};
monthChart.setOption(monthOption);
}
}, 100);
// 关闭弹窗
modal.addEventListener('click', function(e) {
if (e.target === modal || e.target.closest('.close-modal')) {
modal.remove();
}
});
});
</script>
</body>
</html>
