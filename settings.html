<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#3B82F6',secondary:'#EF4444'},borderRadius:{'none':'0px','sm':'4px',DEFAULT:'8px','md':'12px','lg':'16px','xl':'20px','2xl':'24px','3xl':'32px','full':'9999px','button':'8px'}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
<style>
:where([class^="ri-"])::before { content: "\f3c2"; }
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
background-color: #FFFFFF;
}
.divider {
height: 1px;
background-color: #F1F1F1;
width: 100%;
}
</style>
</head>
<body class="bg-white">
<!-- 顶部导航栏 -->
<header class="fixed top-0 left-0 w-full bg-white border-b border-gray-100 z-10">
<div class="flex items-center justify-center h-14 px-4 relative">
<div class="absolute left-4 w-8 h-8 flex items-center justify-center">
<a href=""  class="cursor-pointer">
<i class="ri-arrow-left-s-line ri-lg text-gray-700"></i>
</a>
</div>
<h1 class="text-lg font-medium">设置</h1>
</div>
</header>
<!-- 主要内容区 -->
<main class="pt-16 pb-24 px-4">
<div class="bg-white rounded-lg">
<!-- 政策列表 -->
<div class="py-4">
<a href=""  class="flex items-center justify-between cursor-pointer">
<span class="text-base text-gray-800">政策列表</span>
<div class="w-6 h-6 flex items-center justify-center">
<i class="ri-arrow-right-s-line text-gray-400"></i>
</div>
</a>
<div class="divider mt-4"></div>
</div>
<!-- 版本号 -->
<div class="py-4">
<div class="flex items-center justify-between">
<span class="text-base text-gray-800">版本号</span>
<span class="text-sm text-gray-500">v2.5.3</span>
</div>
<div class="divider mt-4"></div>
</div>
<!-- 清除缓存 -->
<div class="py-4 cursor-pointer" id="clearCache">
<div class="flex items-center justify-between">
<span class="text-base text-gray-800">清除缓存</span>
<span class="text-sm text-gray-500" id="cacheSize">24.5MB</span>
</div>
<div class="divider mt-4"></div>
</div>
</div>
<!-- 退出登录按钮 -->
<div class="fixed bottom-10 left-0 right-0 px-4">
<button id="logoutBtn" class="w-full py-3.5 bg-[#4CAF50] text-white font-medium !rounded-button cursor-pointer">
退出登录
</button>
</div>
</main>
<!-- 清除缓存确认弹窗 -->
<div id="clearCacheModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 hidden">
<div class="bg-white rounded-lg w-4/5 overflow-hidden">
<div class="p-5">
<h3 class="text-lg font-medium text-center mb-3">确认清除缓存</h3>
<p class="text-gray-600 text-center text-sm">清除缓存可能会导致部分数据重新加载，确定要继续吗？</p>
</div>
<div class="flex border-t border-gray-100">
<button id="cancelClear" class="flex-1 py-3 text-gray-500 border-r border-gray-100 cursor-pointer">取消</button>
<button id="confirmClear" class="flex-1 py-3 text-primary font-medium cursor-pointer">确定</button>
</div>
</div>
</div>
<!-- 退出登录确认弹窗 -->
<div id="logoutModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 hidden">
<div class="bg-white rounded-lg w-4/5 overflow-hidden">
<div class="p-5">
<h3 class="text-lg font-medium text-center mb-3">确认退出登录</h3>
<p class="text-gray-600 text-center text-sm">退出后需要重新登录才能使用，确定要退出吗？</p>
</div>
<div class="flex border-t border-gray-100">
<button id="cancelLogout" class="flex-1 py-3 text-gray-500 border-r border-gray-100 cursor-pointer">取消</button>
<button id="confirmLogout" class="flex-1 py-3 text-secondary font-medium cursor-pointer">退出登录</button>
</div>
</div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
// 清除缓存弹窗
const clearCacheBtn = document.getElementById('clearCache');
const clearCacheModal = document.getElementById('clearCacheModal');
const cancelClear = document.getElementById('cancelClear');
const confirmClear = document.getElementById('confirmClear');
clearCacheBtn.addEventListener('click', function() {
clearCacheModal.classList.remove('hidden');
});
cancelClear.addEventListener('click', function() {
clearCacheModal.classList.add('hidden');
});
confirmClear.addEventListener('click', function() {
const cacheSizeElement = document.getElementById('cacheSize');
// 添加清除动画效果
cacheSizeElement.style.transition = 'opacity 0.3s';
cacheSizeElement.style.opacity = '0';
// 模拟清除缓存
setTimeout(() => {
cacheSizeElement.textContent = '0KB';
cacheSizeElement.style.opacity = '1';
clearCacheModal.classList.add('hidden');
}, 500);
});
});
document.addEventListener('DOMContentLoaded', function() {
// 退出登录弹窗
const logoutBtn = document.getElementById('logoutBtn');
const logoutModal = document.getElementById('logoutModal');
const cancelLogout = document.getElementById('cancelLogout');
const confirmLogout = document.getElementById('confirmLogout');

logoutBtn.addEventListener('click', function(e) {
e.preventDefault();
logoutModal.classList.remove('hidden');
});

cancelLogout.addEventListener('click', function() {
logoutModal.classList.add('hidden');
});

confirmLogout.addEventListener('click', function() {
logoutModal.classList.add('hidden');
window.location.href = '
